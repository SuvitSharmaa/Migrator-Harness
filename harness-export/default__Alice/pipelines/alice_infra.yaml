pipeline:
  name: alice-infra
  identifier: alice_infra
  orgIdentifier: default
  projectIdentifier: Alice
  tags:
    iacm: ""
  stages:
    - stage:
        name: Plan
        identifier: plan
        type: IACM
        spec:
          workspace: alice_prod
          infrastructure:
            type: KubernetesDirect
            spec:
              connectorRef: k8s_alice_prod
              namespace: harness-delegate-ng
              os: Linux
              initTimeout: 30m
          execution:
            steps:
              - step:
                  type: IACMTerraformPlugin
                  name: terraform-init
                  identifier: terraform_init
                  timeout: 25m
                  spec:
                    command: init
                    image: us-docker.pkg.dev/gar-prod-setup/harness-public/plugins/harness_terraform:0.237.0_arm64@sha256:3bceb1c976c0ad5d8791c3598fee71573dd724a0dcea30d05d8a92da447c10de
              - step:
                  type: IACMTerraformPlugin
                  name: terraform-plan
                  identifier: terraform_plan
                  timeout: 15m
                  spec:
                    command: plan
                    image: us-docker.pkg.dev/gar-prod-setup/harness-public/plugins/harness_terraform:0.237.0_arm64@sha256:3bceb1c976c0ad5d8791c3598fee71573dd724a0dcea30d05d8a92da447c10de
    - stage:
        name: Approval
        identifier: approval
        type: Approval
        spec:
          execution:
            steps:
              - step:
                  type: HarnessApproval
                  name: Review terraform plan
                  identifier: review_terraform_plan
                  timeout: 1d
                  spec:
                    approvalMessage: |-
                      Review the terraform plan output in the Plan stage before applying to the live alice-prod infrastructure (EKS / RDS / secrets / cluster RBAC). Approve only if the diff is expected.
                    includePipelineExecutionHistory: true
                    isAutoRejectEnabled: false
                    approvers:
                      minimumCount: 1
                      disallowPipelineExecutor: false
                      userGroups:
                        - account._account_all_users
                    approverInputs: []
    - stage:
        name: Apply
        identifier: apply
        type: IACM
        spec:
          workspace: alice_prod
          infrastructure:
            type: KubernetesDirect
            spec:
              connectorRef: k8s_alice_prod
              namespace: harness-delegate-ng
              os: Linux
              initTimeout: 30m
          execution:
            steps:
              - step:
                  type: IACMTerraformPlugin
                  name: terraform-init
                  identifier: terraform_init_apply
                  timeout: 25m
                  spec:
                    command: init
                    image: us-docker.pkg.dev/gar-prod-setup/harness-public/plugins/harness_terraform:0.237.0_arm64@sha256:3bceb1c976c0ad5d8791c3598fee71573dd724a0dcea30d05d8a92da447c10de
              - step:
                  type: IACMTerraformPlugin
                  name: terraform-apply
                  identifier: terraform_apply
                  timeout: 30m
                  spec:
                    command: apply
                    image: us-docker.pkg.dev/gar-prod-setup/harness-public/plugins/harness_terraform:0.237.0_arm64@sha256:3bceb1c976c0ad5d8791c3598fee71573dd724a0dcea30d05d8a92da447c10de

