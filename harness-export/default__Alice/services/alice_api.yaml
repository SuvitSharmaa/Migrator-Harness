service:
  name: alice-api
  identifier: alice_api
  orgIdentifier: default
  projectIdentifier: Alice
  serviceDefinition:
    type: Kubernetes
    spec:
      manifests:
        - manifest:
            identifier: kustomize_overlay
            type: Kustomize
            spec:
              store:
                type: Github
                spec:
                  connectorRef: MPHarness_alice
                  repoName: alice-beta
                  gitFetchType: Branch
                  branch: main
                  folderPath: infra/deploy/overlays/prod
              patchesPaths: []
              pluginPath: ""
        - manifest:
            identifier: image_tag_patch
            # KustomizePatches — Harness evaluates <+...> here. Base
            # kustomization.yaml does NOT reference this file (per
            # karpo's InvalidImageName lesson); Harness merges it
            # into the kustomize build in-memory.
            type: KustomizePatches
            spec:
              store:
                type: Github
                spec:
                  connectorRef: MPHarness_alice
                  repoName: alice-beta
                  gitFetchType: Branch
                  branch: main
                  paths:
                    - infra/deploy/overlays/prod/patch-image.yaml
      artifacts:
        primary:
          primaryArtifactRef: <+input>
          sources:
            - identifier: ecr_alice_api
              type: Ecr
              spec:
                connectorRef: aws_alice_ci
                imagePath: alice-api
                region: ap-southeast-1
                tag: <+input>

