                          fi
                        fi
                      fi

                      echo "cost_change_pct=$cost_change_pct"
                      echo "anomaly_threshold_pct=$ANOMALY_THRESHOLD_PCT"
                      export cost_change_pct
                    outputVariables:
                      - name: cost_change_pct
                        type: String
                        value: cost_change_pct
                    resources:
                      limits:
                        memory: 256Mi
                        cpu: 200m

    # =======================================================================
    # Staging — Approval Gate (skipped unless cost diff ≥ threshold %)
    # Same approver list / Argus webhook as Shared Approval Gate.
    # =======================================================================
    - stage:
        name: Staging Approval Gate
        identifier: staging_approval_gate
        type: Approval
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: MarkAsFailure
        when:
          pipelineStatus: Success
          condition: <+pipeline.stages.staging_init_plan.spec.execution.steps.cost_anomaly_check.output.outputVariables.cost_change_pct> >= 25
        spec:
          execution:
            steps:
              - step:
                  name: Approve Apply
                  identifier: approve_apply
                  type: HarnessApproval
                  timeout: 72h
                  spec:
                    approvalMessage: |
                      **Workspace:** iacm_staging
                      **Cost change:** <+pipeline.stages.staging_init_plan.spec.execution.steps.cost_anomaly_check.output.outputVariables.cost_change_pct>% (threshold 25%)
                      **Pipeline run:** <+pipeline.executionUrl>

                      Review the plan output and IaCM Cost Change Estimation
                      tab in the Harness UI before approving. Approval
                      triggers `terraform apply` against AWS.
                    includePipelineExecutionHistory: true
                    approvers:
                      minimumCount: 1
                      disallowPipelineExecutor: true
                      userGroups:
                        - _project_all_users
                        - account.ResearchDevelopment
                      serviceAccounts:
                        - account.LarkApprover
                    isAutoRejectEnabled: false

    # =======================================================================
    # Staging — Apply
    # =======================================================================
    - stage:
        name: Staging Apply
        identifier: staging_apply
        type: IACM
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: MarkAsFailure
        when:
          pipelineStatus: Success
        spec:
          workspace: iacm_staging
          infrastructure:
            type: KubernetesDirect
            spec:
              connectorRef: k8s_prod
              namespace: karpo
          execution:
            steps:
              - step:
                  type: IACMTerraformPlugin
                  name: Init
                  identifier: init
                  timeout: 10m
                  spec:
                    command: init
                    resources:
                      limits:
                        memory: 1Gi
                        cpu: 500m
              - step:
                  type: IACMTerraformPlugin
                  name: Apply
                  identifier: apply
                  timeout: 30m
                  spec:
                    command: apply
                    resources:
                      limits:
                        memory: 1Gi
                        cpu: 500m

    # =======================================================================
    # Prod — Init / Plan + Cost Anomaly Check
    # =======================================================================
    - stage:
        name: Prod Init Plan
        identifier: prod_init_plan
        type: IACM
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: MarkAsFailure
        when:
          pipelineStatus: Success
        spec:
          workspace: iacm_prod
          infrastructure:
            type: KubernetesDirect
            spec:
              connectorRef: k8s_prod
              namespace: karpo
          execution:
            steps:
              - step:
                  type: IACMTerraformPlugin
                  name: Init
                  identifier: init
                  timeout: 10m
                  spec:
                    command: init
                    resources:
                      limits:
                        memory: 1Gi
                        cpu: 500m
              - step:
                  type: IACMTerraformPlugin
                  name: Plan
                  identifier: plan
                  timeout: 30m
                  spec:
                    command: plan
                    resources:
                      limits:
                        memory: 1Gi
                        cpu: 500m
              # Same cost anomaly check as Shared/Staging Init Plan, but
              # reading iacm_prod workspace's persisted Infracost output.
              - step:
                  type: Run
                  name: Cost Anomaly Check
                  identifier: cost_anomaly_check
                  timeout: 5m
                  spec:
                    shell: Sh
                    image: alpine:3.19
                    connectorRef: dockerhub_anonymous
                    envVariables:
                      HARNESS_API_BASE: https://machinepulse.harness.io
                      HARNESS_ACCOUNT: <+account.identifier>
                      HARNESS_ORG: default
                      HARNESS_PROJECT: KarpoInfra
                      HARNESS_WORKSPACE: iacm_prod
                      ANOMALY_THRESHOLD_PCT: "25"
                      HARNESS_SA_KEY: <+secrets.getValue("harness_sa_api_key")>
