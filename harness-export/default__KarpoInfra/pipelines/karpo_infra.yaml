                  identifier: approve_apply
                  type: HarnessApproval
                  timeout: 72h
                  spec:
                    approvalMessage: |
                      **Workspace:** iacm_prod
                      **Cost change:** <+pipeline.stages.prod_init_plan.spec.execution.steps.cost_anomaly_check.output.outputVariables.cost_change_pct>% (threshold 25%)
                      **Pipeline run:** <+pipeline.executionUrl>

                      Review the plan output and IaCM Cost Change Estimation
                      tab in the Harness UI before approving. Approval
                      triggers `terraform apply` against AWS.
                    includePipelineExecutionHistory: true
                    approvers:
                      minimumCount: 1
                      disallowPipelineExecutor: true
                      userGroups:
                        - _project_all_users
                        - account.ResearchDevelopment
                      serviceAccounts:
                        - account.LarkApprover
                    isAutoRejectEnabled: false

    # =======================================================================
    # Prod — Apply
    # =======================================================================
    - stage:
        name: Prod Apply
        identifier: prod_apply
        type: IACM
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: MarkAsFailure
        when:
          pipelineStatus: Success
        spec:
          workspace: iacm_prod
          # WARNING (Codex PR #234 Issue 2): self-mutating cluster risk.
          # This Apply runs the build pod on prod EKS via k8s_prod, but
          # iacm_prod terraform stack ALSO manages this same EKS cluster
          # (module "eks" in environments/prod/main.tf) and its node
          # groups. An apply that touches the cluster or its nodes can
          # evict / terminate its own runner mid-apply, leaving prod
          # state half-changed and requiring manual recovery.
          # Mitigation during the verification period:
          #   * For PRs that change `module "eks"` / `aws_eks_node_group`
          #     / `aws_eks_addon` resources in environments/prod, route
          #     through the legacy `apply change prod` GHA path (still
          #     alive in .github/workflows/terraform.yml) — runs from a
          #     GitHub-hosted runner outside the cluster.
          # Permanent fix tracked separately: provision a dedicated IaCM
          # build cluster (or enable Harness Hosted VM on this account).
          # When that lands, switch this connectorRef.
          infrastructure:
            type: KubernetesDirect
            spec:
              connectorRef: k8s_prod
              namespace: karpo
          execution:
            steps:
              - step:
                  type: IACMTerraformPlugin
                  name: Init
                  identifier: init
                  timeout: 10m
                  spec:
                    command: init
                    resources:
                      limits:
                        memory: 1Gi
                        cpu: 500m
              - step:
                  type: IACMTerraformPlugin
                  name: Apply
                  identifier: apply
                  timeout: 30m
                  spec:
                    command: apply
                    resources:
                      limits:
                        memory: 1Gi
                        cpu: 500m

  # ===========================================================================
  # Notification rule — fires when the HarnessApproval step in any approval
  # stage moves the pipeline into WaitingForUserAction. Argus receives the
  # webhook and posts a Feishu approval card; clicking Approve in Feishu
  # calls back to Harness via `account.LarkApprover` SA (listed in the
  # step's serviceAccounts).
  #
  # URL + bearer-token secret are the SAME values used by prod CD's
  # main-pipeline.yaml.tpl:942. Switch to argus.machinepulse.ai once
  # Cloudflare access is restored.
  # ===========================================================================
  notificationRules:
    - name: Argus IaCM Approval Webhook
      identifier: argus_iacm_approval_webhook
      pipelineEvents:
        - type: WaitingForUserAction
      notificationMethod:
        type: Webhook
        spec:
          webhookUrl: https://52-3-143-233.sslip.io/webhook/harness/prod-approval
          headers:
            Authorization: 'Bearer <+secrets.getValue("argus_harness_webhook_secret")>'
      enabled: true

