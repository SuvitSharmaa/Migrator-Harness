                      set -u
                      apk add --no-cache curl jq >/dev/null

                      WS_URL="${HARNESS_API_BASE}/iacm/api/orgs/${HARNESS_ORG}/projects/${HARNESS_PROJECT}/workspaces/${HARNESS_WORKSPACE}?accountIdentifier=${HARNESS_ACCOUNT}"

                      WS_JSON=$(curl -sS --max-time 30 -H "x-api-key: ${HARNESS_SA_KEY}" "$WS_URL" || echo "")
                      if [ -z "$WS_JSON" ]; then
                        echo "WARN: workspace API call failed — fail-open with cost_change_pct=0"
                        cost_change_pct=0
                      else
                        COST_UUID=$(printf '%s' "$WS_JSON" | jq -r '.cost_breakdown_json // empty')
                        if [ -z "$COST_UUID" ]; then
                          echo "WARN: cost_breakdown_json UUID not in workspace metadata — cost_change_pct=0"
                          cost_change_pct=0
                        else
                          DATA_URL="${HARNESS_API_BASE}/iacm/api/orgs/${HARNESS_ORG}/projects/${HARNESS_PROJECT}/workspaces/${HARNESS_WORKSPACE}/data/${COST_UUID}?accountIdentifier=${HARNESS_ACCOUNT}"
                          COST_JSON=$(curl -sS --max-time 30 -H "x-api-key: ${HARNESS_SA_KEY}" "$DATA_URL" || echo "")
                          if [ -z "$COST_JSON" ]; then
                            echo "WARN: cost data API call failed — cost_change_pct=0"
                            cost_change_pct=0
                          else
                            CURR=$(printf '%s' "$COST_JSON" | jq -r '.totalMonthlyCost // 0')
                            PAST=$(printf '%s' "$COST_JSON" | jq -r '.pastTotalMonthlyCost // 0')
                            echo "current monthly cost (USD): $CURR"
                            echo "past monthly cost (USD):    $PAST"
                            cost_change_pct=$(awk -v c="$CURR" -v p="$PAST" 'BEGIN { if (p+0 == 0) print 0; else printf "%.0f", (c-p)/p*100 }')
