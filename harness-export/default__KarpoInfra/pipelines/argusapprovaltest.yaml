pipeline:
  name: argus_approval_test
  identifier: argusapprovaltest
  projectIdentifier: KarpoInfra
  orgIdentifier: default
  tags: {}
  stages:
    - stage:
        name: prod_approval_test
        identifier: prodapprovaltest
        description: ""
        type: Approval
        spec:
          execution:
            steps:
              - step:
                  name: manual_approval
                  identifier: manualapproval
                  type: HarnessApproval
                  timeout: 1d
                  spec:
                    approvalMessage: |-
                      ## Risk: low
                      ## Key Changes
                      This is a smoke test for the mentor pipeline change summary format. It validates that Argus can render Harness approval markdown cleanly in the Feishu approval card.
                      ## Details
                      ### argus_approval_test
                      - ci: Verify ## and ### markdown headings are converted into readable Feishu card sections.
                      - test: Confirm approval card still supports approve/reject after summary formatting.
                      ## Attention
                      None
                    includePipelineExecutionHistory: true
                    approvers:
                      minimumCount: 1
                      disallowPipelineExecutor: false
                      userGroups:
                        - account._account_all_users
                      serviceAccounts:
                        - account.LarkApprover
                    isAutoRejectEnabled: false
                    approverInputs: []
        tags: {}
  notificationRules:
    - name: argus_webhook
      identifier: argus_webhook
      pipelineEvents:
        - type: WaitingForUserAction
      notificationMethod:
        type: Webhook
        spec:
          webhookUrl: https://52-3-143-233.sslip.io/webhook/harness/prod-approval
          headers:
            Authorization: Bearer b8c54083f972940192662f5e814358bcc4032b9e8ddd02c9fdac3cc75d62f4da
      enabled: true

