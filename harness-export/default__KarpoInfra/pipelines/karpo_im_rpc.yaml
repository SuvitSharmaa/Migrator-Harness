pipeline:
  name: karpo-im-rpc
  identifier: karpo_im_rpc
  projectIdentifier: KarpoInfra
  orgIdentifier: default
  tags:
    main: ""

  variables:
    - name: image_tag
      type: String
      description: "ECR image tag to deploy to prod (commit SHA from GHA build)."
      required: true
      value: <+input>

  stages:

    # =====================================================================
    # Stage 1: Approval Gate
    # Abort any prior ApprovalWaiting run of THIS pipeline, then generate
    # an LLM change summary, then wait for manual approval.
    # =====================================================================
    - stage:
        name: Approval Gate
        identifier: approval_gate
        type: Approval
        spec:
          execution:
            steps:
              # === ABORT PRIOR PENDING-APPROVAL RUNS ===
              # Harness's autoAbortPreviousExecutions only fires for webhook
              # triggers. Prod CD here is API-triggered (GHA), so a new run
              # would otherwise stack up behind a stale ApprovalWaiting run
              # for up to the 72h approval timeout. This step explicitly
              # aborts any prior ApprovalWaiting execution of the same
              # pipeline so the new run supersedes it.
              # MarkAsSuccess on failure: list/abort errors must NOT block
              # the new deploy (e.g. token expired, prior run was approved
              # in the same window — race-tolerant by design).
              - step:
                  name: Abort Prior Pending Approvals
                  identifier: abort_prior_pending
                  type: ShellScript
                  timeout: 2m
                  failureStrategies:
                    - onFailure:
                        errors:
                          - AllErrors
                        action:
                          type: MarkAsSuccess
                  spec:
                    shell: Bash
                    source:
                      type: Inline
                      spec:
                        script: |
                          #!/bin/bash
                          set -uo pipefail

                          HARNESS_API_KEY='<+secrets.getValue("harness_sa_api_key")>'
                          ACCOUNT_ID="<+account.identifier>"
                          ORG_ID="default"
                          PROJECT_ID="KarpoInfra"
                          PIPELINE_ID="karpo_im_rpc"
                          SELF_PLAN_ID="<+pipeline.executionId>"
                          API_BASE="https://machinepulse.harness.io"

                          # --- jq bootstrap (delegate image lacks jq; same pattern as generate_summary) ---
                          if ! command -v jq >/dev/null 2>&1; then
                            if [ ! -x /tmp/jq ] || \
                               ! echo "5942c9b0934e510ee61eb3e30273f1b3fe2590df93933a93d7c58b81d19c8ff5  /tmp/jq" | sha256sum -c - >/dev/null 2>&1; then
                              curl -sfL "https://github.com/jqlang/jq/releases/download/jq-1.7.1/jq-linux-amd64" -o /tmp/jq && \
                                echo "5942c9b0934e510ee61eb3e30273f1b3fe2590df93933a93d7c58b81d19c8ff5  /tmp/jq" | sha256sum -c - && \
                                chmod +x /tmp/jq
                            fi
                            export PATH="/tmp:$PATH"
                          fi
                          if ! command -v jq >/dev/null 2>&1; then
                            echo "WARN: jq unavailable — skipping abort, allowing new run"
                            exit 0
                          fi

                          # --- 1. List ApprovalWaiting executions of THIS pipeline ---
                          # size=50 page=0 is intentionally a single-page fetch.
                          # Practical ceiling is 1-2 stale ApprovalWaiting runs
                          # (the bug this PR fixes); 50 is a comfortable headroom.
                          # If somehow >50 accumulate, the excess is left for the
                          # NEXT new-trigger to sweep — preferable to paginating
                          # in-band and slowing every deploy.
                          LIST_URL="${API_BASE}/pipeline/api/pipelines/execution/summary?accountIdentifier=${ACCOUNT_ID}&orgIdentifier=${ORG_ID}&projectIdentifier=${PROJECT_ID}&pipelineIdentifier=${PIPELINE_ID}&size=50&page=0"
                          BODY='{"filterType":"PipelineExecution","status":["ApprovalWaiting"]}'

                          if ! RESP=$(curl -sf -X POST "$LIST_URL" \
                              -H "x-api-key: $HARNESS_API_KEY" \
                              -H "content-type: application/json" \
                              -d "$BODY"); then
                            echo "WARN: list API failed — skipping abort, allowing new run"
                            exit 0
                          fi

                          # --- 2. Filter out self, AbortAll the rest ---
                          # Self should not appear (we are Running, not ApprovalWaiting), but
                          # filter anyway in case Harness reports the new run's status as
                          # ApprovalWaiting before this step actually runs (defensive).
                          PLAN_IDS=$(echo "$RESP" | jq -r --arg self "$SELF_PLAN_ID" \
                            '.data.content[]? | select(.planExecutionId != $self) | .planExecutionId')

                          if [ -z "$PLAN_IDS" ]; then
                            echo "No prior pending-approval executions for $PIPELINE_ID"
                            exit 0
                          fi

                          for ID in $PLAN_IDS; do
                            ABORT_URL="${API_BASE}/pipeline/api/pipeline/execute/interrupt/${ID}?accountIdentifier=${ACCOUNT_ID}&orgIdentifier=${ORG_ID}&projectIdentifier=${PROJECT_ID}&interruptType=AbortAll"
                            HTTP=$(curl -s -o /tmp/abort-$ID.json -w '%{http_code}' -X PUT "$ABORT_URL" \
                              -H "x-api-key: $HARNESS_API_KEY")
                            if [ "$HTTP" -ge 200 ] && [ "$HTTP" -lt 300 ]; then
                              echo "aborted prior execution $ID"
                            else
                              echo "WARN: abort $ID returned HTTP $HTTP — $(cat /tmp/abort-$ID.json)"
                              # Don't fail: prior run may have been approved by a human
                              # in the same window. New run continues regardless.
                            fi
                            rm -f /tmp/abort-$ID.json
                          done
                    onDelegate: true
                    delegateSelectors:
                      - karpo-prod

              - step:
                  name: Generate Change Summary
                  identifier: generate_summary
                  type: ShellScript
                  timeout: 5m
                  spec:
                    shell: Bash
                    source:
                      type: Inline
                      spec:
                        script: |
                          #!/bin/bash
                          set -o pipefail

                          OPENROUTER_KEY='<+secrets.getValue("openrouter_api_key")>'
                          CURRENT_SHA="<+pipeline.variables.image_tag>"
                          ORG="machinepulse-ai"
                          REPO="karpo-im-rpc"
                          SERVICE="karpo-im-rpc"
                          LLM_MODEL="anthropic/claude-haiku-4-5"

                          # --- Download jq first (needed for token generation + commit parsing) ---
                          if [ ! -f /tmp/jq ]; then
                            curl -sfL "https://github.com/jqlang/jq/releases/download/jq-1.7.1/jq-linux-amd64" -o /tmp/jq && \
                              echo "5942c9b0934e510ee61eb3e30273f1b3fe2590df93933a93d7c58b81d19c8ff5  /tmp/jq" | sha256sum -c - && \
                              chmod +x /tmp/jq
                          fi
                          JQ=/tmp/jq
                          if [ ! -x "$JQ" ]; then
                            echo "WARN: jq download failed, using raw output"
                            JQ="cat"
                          fi

                          # --- Generate GitHub App token (for API calls, no git clone needed) ---
                          GITHUB_PAT=""
                          if [ "$JQ" != "cat" ]; then
                            APP_ID="3125495"
                            INSTALL_ID="117359680"
                            PEM_FILE=$(mktemp /tmp/gh-app-key-XXXXXXXX.pem)
                            trap "rm -f $PEM_FILE" EXIT
                            printf '%b' '<+secrets.getValue("account.mp_harness_private_key")>' > "$PEM_FILE"
                            chmod 600 "$PEM_FILE"
                            if ! head -1 "$PEM_FILE" | grep -q "BEGIN"; then
                              echo "WARN: PEM file invalid, change summary will be limited"
                            else
                              NOW_JWT=$(date +%s)
                              IAT=$((NOW_JWT - 60))
                              EXP=$((NOW_JWT + 600))
                              HEADER=$(printf '{"alg":"RS256","typ":"JWT"}' | openssl base64 -e -A | tr '+/' '-_' | tr -d '=')
                              PAYLOAD=$(printf '{"iss":"%s","iat":%d,"exp":%d}' "$APP_ID" "$IAT" "$EXP" | openssl base64 -e -A | tr '+/' '-_' | tr -d '=')
                              SIGN_INPUT="$HEADER.$PAYLOAD"
                              SIGNATURE=$(printf '%s' "$SIGN_INPUT" | openssl dgst -sha256 -sign "$PEM_FILE" | openssl base64 -e -A | tr '+/' '-_' | tr -d '=')
                              JWT="$SIGN_INPUT.$SIGNATURE"
                              GITHUB_PAT=$(curl -sf -X POST \
                                -H "Authorization: Bearer $JWT" \
                                -H "Accept: application/vnd.github+json" \
                                "https://api.github.com/app/installations/$INSTALL_ID/access_tokens" \
                                | $JQ -r '.token')
                            fi
                          fi
                          if [ -z "$GITHUB_PAT" ] || [ "$GITHUB_PAT" = "null" ]; then
                            echo "WARN: Failed to generate GitHub App token, change summary will be limited"
                            GITHUB_PAT=""
                          fi

                          # --- Get last prod SHA ---
                          # Priority (Harness delegate has no aws CLI, so we use k8s
                          # resources as the data store instead of SSM):
                          #   1. Deployment annotation karpo.ai/last-prod-sha — authoritative,
                          #      written by the Record Prod Image Tag step at the end of
                          #      Deploy Production. Survives replicaset rollouts.
                          #   2. Live deployment image tag — fallback. Valid once Harness
                          #      has done at least one prod deploy that replaces the overlay's
                          #      default "latest" placeholder with a SHA.
                          # Both values must be a 40-char hex SHA; anything else ("latest",
                          # empty, malformed) is rejected and LAST_PROD_SHA stays empty,
                          # which surfaces a BASELINE_ERROR in the approval message rather
                          # than fabricating a misleading "recent commits" list.
                          echo "=== Resolving last prod SHA ==="
                          LAST_PROD_SHA=""
                          ANNOT_SHA=$(kubectl get deployment $SERVICE -n karpo \
                            -o jsonpath='{.metadata.annotations.karpo\.ai/last-prod-sha}' 2>/dev/null || echo "")
                          if printf '%s' "$ANNOT_SHA" | grep -qE '^[0-9a-f]{40}$'; then
                            LAST_PROD_SHA="$ANNOT_SHA"
                            echo "Last prod SHA (from Deployment annotation): $LAST_PROD_SHA"
                          else
                            [ -n "$ANNOT_SHA" ] && echo "Annotation value '$ANNOT_SHA' is not a 40-char SHA; falling back to image tag" \
                                              || echo "Annotation karpo.ai/last-prod-sha unset; falling back to image tag"
                            PROD_IMAGE=$(kubectl get deployment $SERVICE -n karpo \
                              -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || echo "")
                            if [ -n "$PROD_IMAGE" ]; then
                              TAG="${PROD_IMAGE##*:}"
                              echo "Current prod image: $PROD_IMAGE"
                              if printf '%s' "$TAG" | grep -qE '^[0-9a-f]{40}$'; then
                                LAST_PROD_SHA="$TAG"
                                echo "Last prod SHA (from image tag): $LAST_PROD_SHA"
                              else
                                echo "Image tag '$TAG' is not a 40-char SHA; treating as no baseline"
                              fi
                            else
                              echo "No prod deployment found"
                            fi
                          fi
                          [ -z "$LAST_PROD_SHA" ] && echo "No baseline — approval message will surface an error"

                          echo "=== Generating Change Summary ==="

                          # 1. Get timestamp for dependency filtering
                          SINCE_DATE=""
                          if [ -n "$LAST_PROD_SHA" ]; then
                            TS_RESP=$(curl -sf -H "Authorization: token $GITHUB_PAT" \
                              "https://api.github.com/repos/$ORG/$REPO/commits/$LAST_PROD_SHA" 2>/dev/null || echo "")
                            if [ -n "$TS_RESP" ] && [ "$JQ" != "cat" ]; then
                              SINCE_DATE=$($JQ -r '.commit.committer.date // ""' <<< "$TS_RESP" 2>/dev/null || echo "")
                            fi
                          fi

                          # 2. Collect service repo commits between LAST_PROD_SHA and CURRENT_SHA.
                          # If LAST_PROD_SHA is empty (SSM unset + kubectl tag wasn't a SHA),
                          # we deliberately do NOT fall back to "recent N commits" — that gives
                          # a misleading approval message that looks comprehensive but isn't
                          # bounded by any prod baseline. Instead we surface the error in
                          # CHANGE_SUMMARY so the approver knows to bootstrap the SSM
                          # parameter manually before re-triggering.
                          ALL_COMMITS=""
                          BASELINE_ERROR=""
                          if [ -n "$LAST_PROD_SHA" ]; then
                            CMP=$(curl -sf -H "Authorization: token $GITHUB_PAT" \
                              "https://api.github.com/repos/$ORG/$REPO/compare/${LAST_PROD_SHA}...${CURRENT_SHA}" 2>/dev/null || echo "")
                            if [ -n "$CMP" ] && [ "$JQ" != "cat" ]; then
                              COMMITS=$($JQ -r '.commits[]? | "- " + (.commit.message | split("\n")[0])' <<< "$CMP" 2>/dev/null || echo "")
                            fi
                            [ -n "${COMMITS:-}" ] && ALL_COMMITS="## $REPO"$'\n'"$COMMITS"$'\n'
                            if [ -z "$ALL_COMMITS" ]; then
                              BASELINE_ERROR="**ERROR**: GitHub /compare returned no commits for \`$LAST_PROD_SHA...$CURRENT_SHA\`. Possible causes: baseline SHA not in repo, SHAs identical, or GitHub API auth failed. Check the step log."
                            fi
                          else
                            BASELINE_ERROR="**ERROR**: Could not determine the last prod SHA. Deployment annotation \`karpo.ai/last-prod-sha\` on \`$SERVICE\` is unset (or not a 40-char SHA), and the deployment's image tag is not a SHA (likely \`latest\` from an unchanged kustomize overlay). Bootstrap via \`kubectl annotate deployment $SERVICE -n karpo karpo.ai/last-prod-sha=<SHA> --overwrite\`, then re-trigger. Approving now will deploy without a verified change list."
                          fi

                          # 3. Dependency repo commits: omitted.
                          # Previously this walked clone_repos (karpo-deploy only),
                          # which rarely contained meaningful signal. Summary now
                          # lists the service's own commits since last prod deploy.

                          # 4. Call OpenRouter for LLM summary (fallback: raw commit titles)
                          SUMMARY=""
                          if [ -n "$ALL_COMMITS" ] && [ -n "$OPENROUTER_KEY" ] && [ "$JQ" != "cat" ]; then
                            echo "Calling LLM (model=$LLM_MODEL)..."
                            SYSTEM_PROMPT="You are a deployment change summarizer. Given git commit logs from multiple repos in a microservices system, create a concise summary for the production deployment reviewer.\n\nFormat:\n## Risk: [low/medium/high]\n## Key Changes (2-3 sentences)\n## Details\n### [repo]\n- [type]: description\n## Attention (if any)\n\nRules: group by feat/fix/refactor/config. Flag security/auth/schema changes. Skip empty repos. Under 400 words."

                            REQUEST=$($JQ -n \
                              --arg model "$LLM_MODEL" \
                              --arg system "$SYSTEM_PROMPT" \
                              --arg user "$ALL_COMMITS" \
                              '{model: $model, messages: [{role: "system", content: $system}, {role: "user", content: $user}], temperature: 0.3, max_tokens: 800}')

                            LLM_RESP=$(curl -s "https://openrouter.ai/api/v1/chat/completions" \
                              -H "Content-Type: application/json" \
                              -H "Authorization: Bearer $OPENROUTER_KEY" \
                              -d "$REQUEST" 2>/dev/null || echo "")

                            if [ -n "$LLM_RESP" ]; then
                              SUMMARY=$($JQ -r '.choices[0].message.content // ""' <<< "$LLM_RESP" 2>/dev/null || echo "")
                            fi
                            [ -n "$SUMMARY" ] && echo "LLM summary generated (${#SUMMARY} chars)" || echo "WARN: LLM call failed, using raw commits"
                          else
                            echo "WARN: skipping LLM (commits empty: $([ -z "$ALL_COMMITS" ] && echo yes || echo no), key empty: $([ -z "$OPENROUTER_KEY" ] && echo yes || echo no), jq=$JQ)"
                          fi

                          # 5. Sanitize (prevent Harness expression parsing) and export.
                          # Outputs:
                          #   CHANGE_SUMMARY — LLM-formatted summary, or the raw commit list if the
                          #                    LLM call failed, or the BASELINE_ERROR message if we
                          #                    couldn't establish a prod baseline at all.
                          #   RAW_COMMITS    — the unprocessed commit list, ground-truth input for
                          #                    the release-note step. Empty string if no baseline.
                          # Step does NOT exit non-zero on baseline failure — the approver should
                          # see the error in the approval message and decide whether to proceed.
                          if [ -n "$SUMMARY" ]; then
                            CHANGE_SUMMARY=$(echo "$SUMMARY" | sed 's/<+/< +/g')
                          elif [ -n "$ALL_COMMITS" ]; then
                            CHANGE_SUMMARY=$(echo "$ALL_COMMITS" | sed 's/<+/< +/g')
                          elif [ -n "$BASELINE_ERROR" ]; then
                            CHANGE_SUMMARY="$BASELINE_ERROR"
                          else
                            CHANGE_SUMMARY="**ERROR**: No commits and no diagnosable baseline error — likely a bug in generate_summary itself. Check step log."
                          fi
                          if [ -n "$ALL_COMMITS" ]; then
                            RAW_COMMITS=$(echo "$ALL_COMMITS" | sed 's/<+/< +/g')
                          else
                            RAW_COMMITS=""
                          fi
                          export CHANGE_SUMMARY RAW_COMMITS LAST_PROD_SHA
                          echo "=== Change Summary ==="
                          echo "$CHANGE_SUMMARY"
                    outputVariables:
                      - name: CHANGE_SUMMARY
                        type: String
                        value: CHANGE_SUMMARY
                      - name: RAW_COMMITS
                        type: String
                        value: RAW_COMMITS
                      - name: LAST_PROD_SHA
                        type: String
                        value: LAST_PROD_SHA
                    onDelegate: true
                    delegateSelectors:
                      - karpo-prod

              - step:
                  name: Approve Production Deploy
                  identifier: approve_prod
                  type: HarnessApproval
                  timeout: 72h
                  spec:
                    approvalMessage: |
                      **Service:** karpo-im-rpc
                      **Compare:** https://github.com/machinepulse-ai/karpo-im-rpc/compare/<+pipeline.stages.approval_gate.spec.execution.steps.generate_summary.output.outputVariables.LAST_PROD_SHA>...<+pipeline.variables.image_tag>

                      ### Commits since last prod deploy
                      <+pipeline.stages.approval_gate.spec.execution.steps.generate_summary.output.outputVariables.RAW_COMMITS>

                      ---

                      <+pipeline.stages.approval_gate.spec.execution.steps.generate_summary.output.outputVariables.CHANGE_SUMMARY>
                    includePipelineExecutionHistory: true
                    # Approver list spans 3 entries because each unblocks a different click path:
                    #   _project_all_users — KarpoInfra-scoped (only members with project access); covers in-Harness-UI clicks.
                    #   account.ResearchDevelopment — RD members not in KarpoInfra project hit Argus's pre-flight
                    #     allowed-emails check empty without this group, so Lark Approve rejects them.
                    #   account.LarkApprover — Argus proxies the human's click via this SA's SAT; Harness 400s on
                    #     approve_execution if the calling principal isn't in the approval's serviceAccounts list.
                    # Removing any one re-breaks Lark Approve for some subset of users.
                    approvers:
                      minimumCount: 1
                      disallowPipelineExecutor: false
                      userGroups:
                        - _project_all_users
                        - account.ResearchDevelopment
                      serviceAccounts:
                        - account.LarkApprover
                    isAutoRejectEnabled: false

    # =====================================================================
    # Stage 2: Deploy to Production
    # Canary phase (K8sCanaryDeploy + Datadog CV) only runs when
    # canary_enabled=true. Rolling deploy always runs.
    # GitHub release is created after rolling deploy succeeds.
    # =====================================================================
    - stage:
        name: Deploy Production
        identifier: deploy_prod
        type: Deployment
        spec:
          deploymentType: Kubernetes
          service:
            serviceRef: karpo_im_rpc
            serviceInputs:
              serviceDefinition:
                type: Kubernetes
                spec:
                  variables:
                    - name: kustomize_folder
                      type: String
                      value: overlays/prod/per-service/karpo-im-rpc
                  artifacts:
                    primary:
                      sources:
                        - identifier: ecr_image
                          type: Ecr
                          spec:
                            tag: <+pipeline.variables.image_tag>
          environment:
            environmentRef: prod
            deployToAll: false
            infrastructureDefinitions:
              - identifier: prod_eks
          execution:
            steps:
              # === PRE-PROD HOOK ===



              - stepGroup:
                  name: Canary Phase
                  identifier: canary_phase
                  steps:
                    - step:
                        name: Canary Deploy
                        identifier: canary_deploy
                        type: K8sCanaryDeploy
                        timeout: 10m
                        spec:
                          instanceSelection:
                            type: Count
                            spec:
                              count: 1
                          skipDryRun: false
                    - step:
                        name: Canary Health Check
                        identifier: canary_dd_check
                        type: ShellScript
                        timeout: 15m
                        spec:
                          shell: Bash
                          source:
                            type: Inline
                            spec:
                              script: |
                                #!/bin/bash
                                # Two-layer canary verification:
                                #   A. kubectl readiness gate (fast, catches CrashLoop / ImagePullBackOff)
                                #   B. wait for metrics to accumulate
                                #   C. kubectl restart count (instant signal)
                                #   D. DD K8s metrics (trend signal: restarts, memory, cpu)
                                # Zero DD data → WARN + continue (low-QPS services are valid).
                                # Missing canary pods → FAIL CLOSED (can't verify = broken).
                                set -uo pipefail

                                DD_API_KEY="<+secrets.getValue("dd_cv_api_key")>"
                                DD_APP_KEY="<+secrets.getValue("dd_cv_app_key")>"
                                DD_SITE="https://api.us5.datadoghq.com"
                                SERVICE="karpo-im-rpc"
                                NAMESPACE="karpo"
                                CLUSTER="eks-karpo-prod"
                                WAIT_SECONDS=180
                                READY_TIMEOUT=300
                                RESTART_THRESHOLD=0
                                MEM_RATIO=1.5
                                CPU_RATIO=2
                                MEM_FLOOR_BYTES=268435456
                                CPU_FLOOR_NANOCORES=50000000

                                echo "=== Canary Health Check ==="
                                echo "Service:   $SERVICE"
                                echo "Namespace: $NAMESPACE"
                                echo "Track:     canary"
                                echo ""

                                # --- Phase 0: ensure jq is available ---
                                # Delegate image does not ship with jq. Without this bootstrap,
                                # Phase A's jq calls silently yield empty strings, the readiness
                                # loop never matches "0", and we burn the full READY_TIMEOUT
                                # before reporting a blank pod count in the failure message
                                # (observed: karpo_chat_api run #125, 5-min timeout on a healthy
                                # canary pod). Fail-fast with a clear message instead. Same
                                # download pattern the release-notes step already uses.
                                echo "==> Phase 0: jq availability"
                                if ! command -v jq >/dev/null 2>&1; then
                                  # Cache-guard re-verifies sha256 on every run: a match skips the
                                  # download (fast path), a mismatch re-downloads. Without this
                                  # re-check, a previously-cached /tmp/jq on the long-running
                                  # delegate pod would be reused indefinitely with no integrity
                                  # check after the very first download.
                                  if [ ! -x /tmp/jq ] || \
                                     ! echo "5942c9b0934e510ee61eb3e30273f1b3fe2590df93933a93d7c58b81d19c8ff5  /tmp/jq" | sha256sum -c - >/dev/null 2>&1; then
                                    curl -sfL "https://github.com/jqlang/jq/releases/download/jq-1.7.1/jq-linux-amd64" -o /tmp/jq && \
                                      echo "5942c9b0934e510ee61eb3e30273f1b3fe2590df93933a93d7c58b81d19c8ff5  /tmp/jq" | sha256sum -c - && \
                                      chmod +x /tmp/jq
                                  fi
                                  export PATH="/tmp:$PATH"
                                  if ! command -v jq >/dev/null 2>&1; then
                                    echo "FAIL: jq unavailable on delegate and bootstrap download failed"
                                    exit 1
                                  fi
                                fi
                                echo "    jq: $(command -v jq) ($(jq --version))"
                                echo ""

                                # --- Phase A: readiness gate ---
                                echo "==> Phase A: waiting for canary pod readiness (timeout ${READY_TIMEOUT}s)"
                                DEADLINE=$(($(date +%s) + READY_TIMEOUT))
                                while :; do
                                  PODS_JSON=$(kubectl get pods -n "$NAMESPACE" \
                                    -l "app=$SERVICE,harness.io/track=canary" \
                                    -o json 2>/dev/null || echo '{"items":[]}')
                                  COUNT=$(echo "$PODS_JSON" | jq '.items | length')
                                  if [ "$COUNT" = "0" ]; then
                                    if [ $(date +%s) -gt "$DEADLINE" ]; then
                                      echo "FAIL: no canary pods found after ${READY_TIMEOUT}s"
                                      echo "      check label selector, namespace, and delegate RBAC"
                                      exit 1
                                    fi
                                    sleep 2
                                    continue
                                  fi
                                  NOT_READY=$(echo "$PODS_JSON" | jq '[.items[].status.containerStatuses[]? | select(.ready != true)] | length')
                                  if [ "$NOT_READY" = "0" ]; then
                                    echo "    OK: $COUNT canary pod(s) ready"
                                    break
                                  fi
                                  if [ $(date +%s) -gt "$DEADLINE" ]; then
                                    echo "FAIL: $NOT_READY canary container(s) not Ready after ${READY_TIMEOUT}s"
                                    kubectl describe pods -n "$NAMESPACE" -l "app=$SERVICE,harness.io/track=canary" 2>/dev/null | tail -40 || true
                                    exit 1
                                  fi
                                  sleep 2
                                done

                                # --- Phase B: metric accumulation window ---
                                echo ""
                                echo "==> Phase B: waiting ${WAIT_SECONDS}s for canary metrics to accumulate"
                                sleep "$WAIT_SECONDS"

                                # --- Phase C: kubectl restart count (instant) ---
                                # Fail-closed: a kubectl error here (RBAC, network, API server)
                                # must NOT be converted to "0 restarts" via a fallback and silently
                                # pass. Phase A's loop tolerates transient kubectl failure because
                                # the deadline catches them; Phase C is a single call so any failure
                                # must abort.
                                echo ""
                                echo "==> Phase C: canary pod restart count (via kubectl)"
                                if ! PODS_JSON=$(kubectl get pods -n "$NAMESPACE" \
                                  -l "app=$SERVICE,harness.io/track=canary" \
                                  -o json); then
                                  echo "FAIL: kubectl failed in Phase C — cannot verify canary restart count"
                                  exit 1
                                fi
                                TOTAL_RESTARTS=$(echo "$PODS_JSON" | jq '[.items[].status.containerStatuses[]?.restartCount] | add // 0')
                                # Validate jq produced a numeric value. Without this, a jq failure
                                # (malformed JSON from kubectl) would leave TOTAL_RESTARTS empty
                                # and `[ "" -gt 0 ]` would print an error to stderr but not exit,
                                # silently bypassing the restart gate.
                                if ! printf '%s' "$TOTAL_RESTARTS" | grep -qE '^[0-9]+$'; then
                                  echo "FAIL: jq produced non-numeric restart count: '$TOTAL_RESTARTS'"
                                  exit 1
                                fi
                                echo "    restartCount sum: $TOTAL_RESTARTS (threshold ${RESTART_THRESHOLD})"
                                if [ "$TOTAL_RESTARTS" -gt "$RESTART_THRESHOLD" ]; then
                                  echo "FAIL: canary pod restart count $TOTAL_RESTARTS exceeds threshold ${RESTART_THRESHOLD}"
                                  kubectl describe pods -n "$NAMESPACE" -l "app=$SERVICE,harness.io/track=canary" 2>/dev/null | tail -40 || true
                                  exit 1
                                fi

                                # --- Phase D: DD K8s metric queries ---
                                echo ""
                                echo "==> Phase D: Datadog K8s metric checks"
                                NOW=$(date +%s)
                                FROM=$((NOW - WAIT_SECONDS - 60))

                                query_dd() {
                                  curl -sS -G "$DD_SITE/api/v1/query" \
                                    --data-urlencode "query=$1" \
                                    --data-urlencode "from=$FROM" --data-urlencode "to=$NOW" \
                                    -H "DD-API-KEY: $DD_API_KEY" -H "DD-APPLICATION-KEY: $DD_APP_KEY"
                                }

                                dd_avg_or_empty() {
                                  local resp="$1"
                                  local n
                                  n=$(echo "$resp" | jq -r '.series | length // 0')
                                  if [ "$n" = "0" ]; then
                                    echo "empty"
                                    return
                                  fi
                                  # Aggregate points across ALL series (DD may split a single metric
                                  # across multiple series when the queried tag set isn't fully
                                  # constraining, e.g. per-container dimensions). Taking only
                                  # .series[0] would under-report sum queries and could hide a real
                                  # breach.
                                  echo "$resp" | jq -r '[.series[].pointlist[]?[1] | select(. != null)] | if length == 0 then "empty" else (add / length) end'
                                }

                                # D.1 restart count via DD
                                R_RESP=$(query_dd "sum:kubernetes.containers.restarts{kube_cluster_name:$CLUSTER,kube_deployment:$SERVICE-canary,kube_label_harness_io_track:canary}.as_count()")
                                R_VAL=$(dd_avg_or_empty "$R_RESP")
                                if [ "$R_VAL" = "empty" ]; then
                                  echo "    WARN: DD restarts metric returned no data — skipping (metric indexing lag or low traffic)"
                                else
                                  R_INT=$(printf '%.0f' "$R_VAL" 2>/dev/null || echo 0)
                                  echo "    DD restarts (window): $R_INT (threshold ${RESTART_THRESHOLD})"
                                  if [ "$R_INT" -gt "$RESTART_THRESHOLD" ]; then
                                    echo "FAIL: DD reports canary restart count $R_INT > threshold ${RESTART_THRESHOLD}"
                                    exit 1
                                  fi
                                fi

                                # D.2 memory ratio (canary / stable)
                                M_CAN_RESP=$(query_dd "avg:kubernetes.memory.working_set{kube_cluster_name:$CLUSTER,kube_deployment:$SERVICE-canary,kube_label_harness_io_track:canary}")
                                M_STB_RESP=$(query_dd "avg:kubernetes.memory.working_set{kube_cluster_name:$CLUSTER,kube_deployment:$SERVICE,kube_label_harness_io_track:stable}")
                                M_CAN=$(dd_avg_or_empty "$M_CAN_RESP")
                                M_STB=$(dd_avg_or_empty "$M_STB_RESP")
                                if [ "$M_CAN" = "empty" ] || [ "$M_STB" = "empty" ]; then
                                  echo "    WARN: DD memory metric returned no data for canary or stable — skipping ratio check"
                                else
                                  # Zero-stable is treated as missing data, NOT as "ratio 0 which
                                  # passes". DD can return 0 during metric indexing lag even when
                                  # stable pods are actually using memory; unconditionally passing
                                  # would silently skip a real canary breach.
                                  RATIO=$(awk -v c="$M_CAN" -v s="$M_STB" 'BEGIN { if (s+0==0) print "empty"; else printf "%.3f", c/s }')
                                  if [ "$RATIO" = "empty" ]; then
                                    echo "    WARN: stable memory is 0 (metric lag?) — skipping memory ratio check"
                                  elif awk -v c="$M_CAN" -v f="${MEM_FLOOR_BYTES}" 'BEGIN { exit !(c+0 < f+0) }'; then
                                    # Small-baseline skip: tiny absolute footprint makes ratio noise-dominated.
                                    # karpo-task-rpc stable ~27 MiB caused false 2.05x breaches in prod 2026-05.
                                    echo "    skip: canary memory $M_CAN bytes < floor ${MEM_FLOOR_BYTES} — ratio not meaningful at this scale"
                                  else
                                    echo "    memory ratio canary/stable = $RATIO (threshold ${MEM_RATIO})"
                                    if awk -v r="$RATIO" -v t="${MEM_RATIO}" 'BEGIN { exit !(r+0 > t+0) }'; then
                                      echo "FAIL: canary memory ratio $RATIO exceeds threshold ${MEM_RATIO}"
                                      exit 1
                                    fi
                                  fi
                                fi

                                # D.3 cpu ratio (canary / stable)
                                C_CAN_RESP=$(query_dd "avg:kubernetes.cpu.usage.total{kube_cluster_name:$CLUSTER,kube_deployment:$SERVICE-canary,kube_label_harness_io_track:canary}")
                                C_STB_RESP=$(query_dd "avg:kubernetes.cpu.usage.total{kube_cluster_name:$CLUSTER,kube_deployment:$SERVICE,kube_label_harness_io_track:stable}")
                                C_CAN=$(dd_avg_or_empty "$C_CAN_RESP")
                                C_STB=$(dd_avg_or_empty "$C_STB_RESP")
                                if [ "$C_CAN" = "empty" ] || [ "$C_STB" = "empty" ]; then
                                  echo "    WARN: DD cpu metric returned no data for canary or stable — skipping ratio check"
                                else
                                  RATIO=$(awk -v c="$C_CAN" -v s="$C_STB" 'BEGIN { if (s+0==0) print "empty"; else printf "%.3f", c/s }')
                                  if [ "$RATIO" = "empty" ]; then
                                    echo "    WARN: stable cpu is 0 (metric lag?) — skipping cpu ratio check"
                                  elif awk -v c="$C_CAN" -v f="${CPU_FLOOR_NANOCORES}" 'BEGIN { exit !(c+0 < f+0) }'; then
                                    # Small-baseline skip: all current services idle at ~1m, so any
                                    # warmup blip dominates the ratio without meaning anything.
                                    echo "    skip: canary cpu $C_CAN nanocores < floor ${CPU_FLOOR_NANOCORES} — ratio not meaningful at this scale"
                                  else
                                    echo "    cpu ratio canary/stable = $RATIO (threshold ${CPU_RATIO})"
                                    if awk -v r="$RATIO" -v t="${CPU_RATIO}" 'BEGIN { exit !(r+0 > t+0) }'; then
                                      echo "FAIL: canary cpu ratio $RATIO exceeds threshold ${CPU_RATIO}"
                                      exit 1
                                    fi
                                  fi
                                fi

                                echo ""
                                echo "=== Canary health check passed ==="
                          onDelegate: true
                          delegateSelectors:
                            - karpo-prod
                    - step:
                        name: Canary Delete
                        identifier: canary_delete
                        type: K8sCanaryDelete
                        timeout: 10m
                        spec: {}
                  rollbackSteps:
                    - step:
                        name: Canary Rollback
                        identifier: canary_rollback
                        type: K8sCanaryDelete
                        timeout: 10m
                        spec: {}

              - stepGroup:
                  name: Primary Deploy
                  identifier: primary_deploy
                  steps:
                    - step:
                        name: Rolling Deploy
                        identifier: prod_rolling_deploy
                        type: K8sRollingDeploy
                        timeout: 10m
                        spec:
                          skipDryRun: false
                  rollbackSteps:
                    - step:
                        name: Rolling Rollback
                        identifier: prod_rollback
                        type: K8sRollingRollback
                        timeout: 10m
                        spec: {}

              # === RECORD DEPLOYED PROD IMAGE TAG (k8s Deployment annotation) ===
              # Annotates the Deployment with karpo.ai/last-prod-sha=<SHA> so
              # the next pipeline run's generate_summary step can compute a
              # correct GitHub /compare baseline. Using an annotation instead
              # of SSM because the Harness delegate image does not ship aws
              # CLI. Annotation survives replicaset rollouts and is cheap to
              # read with kubectl.
              - step:
                  name: Record Prod Image Tag
                  identifier: record_prod_image_tag
                  type: ShellScript
                  timeout: 2m
                  failureStrategies:
                    - onFailure:
                        errors:
                          - AllErrors
                        action:
                          type: MarkAsSuccess
                  spec:
                    shell: Bash
                    source:
                      type: Inline
                      spec:
                        script: |
                          #!/bin/bash
                          set -o pipefail
                          SERVICE="karpo-im-rpc"
                          TAG="<+pipeline.variables.image_tag>"
                          if ! printf '%s' "$TAG" | grep -qE '^[0-9a-f]{40}$'; then
                            echo "WARN: image_tag '$TAG' is not a 40-char SHA; skipping annotation write"
                            exit 0
                          fi
                          if kubectl annotate deployment "$SERVICE" -n karpo \
                              "karpo.ai/last-prod-sha=$TAG" --overwrite; then
                            echo "Annotated deployment/$SERVICE with karpo.ai/last-prod-sha=$TAG"
                          else
                            echo "WARN: kubectl annotate failed — next run's change summary will fall back to image tag"
                          fi
                    onDelegate: true
                    delegateSelectors:
                      - karpo-prod

              # === POST-DEPLOY HOOK ===


              # === CREATE GITHUB RELEASE (after successful prod deploy) ===
              - step:
                  name: Create GitHub Release
                  identifier: create_github_release
                  type: ShellScript
                  timeout: 5m
                  failureStrategies:
                    - onFailure:
                        errors:
                          - AllErrors
                        action:
                          type: MarkAsSuccess
                  spec:
                    shell: Bash
                    # CHANGE_SUMMARY and RAW_COMMITS are injected as real env vars via
                    # Harness, not interpolated into the script source, so apostrophes
                    # and other bash metacharacters in commit messages cannot break the
                    # shell parse. RAW_COMMITS is the ground-truth commit list used to
                    # both feed the LLM and fall back to when the LLM output is garbage.
                    environmentVariables:
                      - name: CHANGE_SUMMARY
                        type: String
                        value: <+pipeline.stages.approval_gate.spec.execution.steps.generate_summary.output.outputVariables.CHANGE_SUMMARY>
                      - name: RAW_COMMITS
                        type: String
                        value: <+pipeline.stages.approval_gate.spec.execution.steps.generate_summary.output.outputVariables.RAW_COMMITS>
                    source:
                      type: Inline
                      spec:
                        script: |
                          #!/bin/bash
                          set -o pipefail

                          OPENROUTER_KEY='<+secrets.getValue("openrouter_api_key")>'
                          CURRENT_SHA="<+pipeline.variables.image_tag>"
                          ORG="machinepulse-ai"
                          REPO="karpo-im-rpc"
                          LLM_MODEL="anthropic/claude-haiku-4-5"

                          # --- jq ---
                          JQ=/tmp/jq
                          if [ ! -x "$JQ" ]; then
                            curl -sfL "https://github.com/jqlang/jq/releases/download/jq-1.7.1/jq-linux-amd64" -o /tmp/jq && \
                              echo "5942c9b0934e510ee61eb3e30273f1b3fe2590df93933a93d7c58b81d19c8ff5  /tmp/jq" | sha256sum -c - && \
                              chmod +x /tmp/jq
                          fi
                          if [ ! -x "$JQ" ]; then
                            echo "WARN: jq not available, skipping release creation"
                            exit 0
                          fi

                          # --- Generate GitHub App token ---
                          APP_ID="3125495"
                          INSTALL_ID="117359680"
                          PEM_FILE=$(mktemp /tmp/gh-app-key-XXXXXXXX.pem)
                          trap "rm -f $PEM_FILE" EXIT
                          printf '%b' '<+secrets.getValue("account.mp_harness_private_key")>' > "$PEM_FILE"
                          chmod 600 "$PEM_FILE"
                          if ! head -1 "$PEM_FILE" | grep -q "BEGIN"; then
                            echo "WARN: PEM file invalid, skipping release creation"
                            exit 0
                          fi
                          NOW_JWT=$(date +%s)
                          IAT=$((NOW_JWT - 60))
                          EXP=$((NOW_JWT + 600))
                          HEADER=$(printf '{"alg":"RS256","typ":"JWT"}' | openssl base64 -e -A | tr '+/' '-_' | tr -d '=')
                          PAYLOAD=$(printf '{"iss":"%s","iat":%d,"exp":%d}' "$APP_ID" "$IAT" "$EXP" | openssl base64 -e -A | tr '+/' '-_' | tr -d '=')
                          SIGN_INPUT="$HEADER.$PAYLOAD"
                          SIGNATURE=$(printf '%s' "$SIGN_INPUT" | openssl dgst -sha256 -sign "$PEM_FILE" | openssl base64 -e -A | tr '+/' '-_' | tr -d '=')
                          JWT="$SIGN_INPUT.$SIGNATURE"
                          GITHUB_TOKEN=$(curl -sf -X POST \
                            -H "Authorization: Bearer $JWT" \
                            -H "Accept: application/vnd.github+json" \
                            "https://api.github.com/app/installations/$INSTALL_ID/access_tokens" \
                            | $JQ -r '.token')
                          if [ -z "$GITHUB_TOKEN" ] || [ "$GITHUB_TOKEN" = "null" ]; then
                            echo "WARN: Failed to generate GitHub token, skipping release creation"
                            exit 0
                          fi

                          # --- Get latest release tag and bump patch ---
                          echo "=== Creating GitHub Release ==="
                          LATEST_TAG=$(curl -sf -H "Authorization: token $GITHUB_TOKEN" \
                            "https://api.github.com/repos/$ORG/$REPO/releases/latest" \
                            | $JQ -r '.tag_name // ""' 2>/dev/null || echo "")
                          echo "Latest release: $LATEST_TAG"

                          if [ -z "$LATEST_TAG" ]; then
                            NEW_TAG="v0.1.0"
                          else
                            # Parse vX.Y.Z and bump Z
                            MAJOR=$(echo "$LATEST_TAG" | sed 's/^v//' | cut -d. -f1)
                            MINOR=$(echo "$LATEST_TAG" | sed 's/^v//' | cut -d. -f2)
                            PATCH=$(echo "$LATEST_TAG" | sed 's/^v//' | cut -d. -f3)
                            NEW_TAG="v$MAJOR.$MINOR.$((PATCH + 1))"
                          fi
                          echo "New release: $NEW_TAG"

                          # --- Use LLM to format release notes ---
                          # Strategy (see PR #140 for context on prior hallucination issues):
                          #   1. Call LLM with explicit "never invent PR numbers" instructions and
                          #      pass RAW_COMMITS (ground truth) alongside CHANGE_SUMMARY as input.
                          #   2. If the LLM output is empty, missing, or references a PR number that
                          #      does not appear in RAW_COMMITS, fall back to the raw commit list —
                          #      truthful even if less pretty than a categorized release note.
                          RELEASE_BODY=""
                          if [ -n "$CHANGE_SUMMARY" ] && [ -n "$OPENROUTER_KEY" ]; then
                            SYSTEM_PROMPT="You are a release note formatter. You will be given a list of git commits for a single repository. Reformat them into a GitHub release note.\n\nOutput format:\n## NEW_TAG\n\n### Added\n- <short description> (#<pr_number>)\n\n### Fixed\n- <short description> (#<pr_number>)\n\n### Changed\n- <short description> (#<pr_number>)\n\n**Full Changelog**: https://github.com/GITHUB_ORG/GITHUB_REPO/compare/PREV_TAG...NEW_TAG\n\nHARD RULES (violations will be detected and rejected):\n1. Only reference PR numbers that appear verbatim in the input commits. If a commit does not have a (#N) suffix, omit the PR number; do NOT invent one.\n2. Only reference services, repos, features, or file paths that appear verbatim in the input commits. Do NOT mention other repositories, services, or unrelated concepts from general knowledge.\n3. Categorize by conventional commit prefix: feat→Added, fix→Fixed, refactor/chore/perf/docs/ci→Changed. Skip a section entirely if it has no commits.\n4. Keep each line under 120 characters. One commit per line.\n5. Do not output a Risk section, an Attention section, or any preamble."

                            SYSTEM_PROMPT=$(printf '%s' "$SYSTEM_PROMPT" | sed "s|GITHUB_ORG|$ORG|g;s|GITHUB_REPO|$REPO|g;s|PREV_TAG|$LATEST_TAG|g;s|NEW_TAG|$NEW_TAG|g")

                            # User content: put RAW_COMMITS first (ground truth for PR numbers), then
                            # the LLM-summarised CHANGE_SUMMARY as supplementary context.
                            USER_CONTENT="Raw commit list for $REPO between $LATEST_TAG and $NEW_TAG:"$'\n\n'"$RAW_COMMITS"$'\n\n---\n\nSummarised context (may itself be imperfect — treat the raw list above as ground truth):'$'\n\n'"$CHANGE_SUMMARY"

                            REQUEST=$($JQ -n \
                              --arg model "$LLM_MODEL" \
                              --arg system "$SYSTEM_PROMPT" \
                              --arg user "$USER_CONTENT" \
                              '{model: $model, messages: [{role: "system", content: $system}, {role: "user", content: $user}], temperature: 0, max_tokens: 1500}')

                            LLM_RESP=$(curl -s "https://openrouter.ai/api/v1/chat/completions" \
                              -H "Content-Type: application/json" \
                              -H "Authorization: Bearer $OPENROUTER_KEY" \
                              -d "$REQUEST" 2>/dev/null || echo "")

                            if [ -n "$LLM_RESP" ]; then
                              RELEASE_BODY=$($JQ -r '.choices[0].message.content // ""' <<< "$LLM_RESP" 2>/dev/null || echo "")
                            fi

                            # Post-LLM sanity check: every (#N) reference must appear in RAW_COMMITS.
                            # Gate the LLM output, not the fallback, because the fallback is raw.
                            if [ -n "$RELEASE_BODY" ]; then
                              FABRICATED=""
                              for pr in $(printf '%s' "$RELEASE_BODY" | grep -oE '#[0-9]+' | sort -u); do
                                if ! printf '%s' "$RAW_COMMITS" | grep -qF "$pr"; then
                                  FABRICATED="$FABRICATED $pr"
                                fi
                              done
                              if [ -n "$FABRICATED" ]; then
                                echo "WARN: LLM fabricated PR numbers:$FABRICATED"
                                echo "WARN: discarding LLM output, falling back to raw commit list"
                                RELEASE_BODY=""
                              fi
                            fi
                          fi

                          # Fallback: raw commit list (ground truth, never passed through an LLM)
                          if [ -z "$RELEASE_BODY" ]; then
                            RELEASE_BODY="## $NEW_TAG"$'\n\n'"$RAW_COMMITS"$'\n\n'"**Full Changelog**: https://github.com/$ORG/$REPO/compare/$LATEST_TAG...$NEW_TAG"
                          fi

                          echo "=== Release Notes ==="
                          echo "$RELEASE_BODY"

                          # --- Create GitHub release ---
                          RELEASE_PAYLOAD=$($JQ -n \
                            --arg tag "$NEW_TAG" \
                            --arg name "$NEW_TAG" \
                            --arg body "$RELEASE_BODY" \
                            --arg sha "$CURRENT_SHA" \
                            '{tag_name: $tag, name: $name, body: $body, target_commitish: $sha, draft: false, prerelease: false}')

                          HTTP_CODE=$(curl -s -o /tmp/release_resp.json -w '%%{http_code}' -X POST \
                            -H "Authorization: token $GITHUB_TOKEN" \
                            -H "Accept: application/vnd.github+json" \
                            "https://api.github.com/repos/$ORG/$REPO/releases" \
                            -d "$RELEASE_PAYLOAD")

                          if [ "$HTTP_CODE" = "201" ]; then
                            RELEASE_URL=$($JQ -r '.html_url' /tmp/release_resp.json)
                            echo "=== Release created: $RELEASE_URL ==="
                          else
                            echo "WARN: Release creation returned HTTP $HTTP_CODE"
                            cat /tmp/release_resp.json
                            echo "Release creation failed but not blocking deploy"
                          fi
                          rm -f /tmp/release_resp.json
                    onDelegate: true
                    delegateSelectors:
                      - karpo-prod
            rollbackSteps: []
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: StageRollback

  notificationRules:
    - name: Argus Prod Approval Webhook
      identifier: argus_prod_approval_webhook
      pipelineEvents:
        - type: WaitingForUserAction
      notificationMethod:
        type: Webhook
        spec:
          webhookUrl: https://52-3-143-233.sslip.io/webhook/harness/prod-approval
          headers:
            Authorization: 'Bearer <+secrets.getValue("argus_harness_webhook_secret")>'
      enabled: true

