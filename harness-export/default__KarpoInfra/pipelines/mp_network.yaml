pipeline:
  name: mp-network
  identifier: mp_network
  projectIdentifier: KarpoInfra
  orgIdentifier: default
  tags:
    iacm: ""

  # ===========================================================================
  # Fixed 3-stage chain for mp-network/environments/prod — independent of the
  # `karpo_infra` pipeline (different repo, different change cadence, different
  # blast radius). Same trio shape as each stack in `iacm-plan.yaml.tpl`:
  # init+plan+cost-anomaly Run → conditional HarnessApproval → init+apply.
  #
  # Within the trio the Approval Gate is skipped (auto-apply) when the cost
  # diff vs the previous applied state is below
  # `iacm_cost_anomaly_threshold_pct` (currently 25 for all stacks);
  # otherwise it sends a Feishu approval card via Argus and blocks the
  # following Apply stage until a human approves. Per mentor (MAC-1002):
  # PR review is the primary control, Harness approval is reserved for
  # anomalies.
  #
  # SKELETON CAVEAT (2026-05-14): the workspace `iacm_mp_network` will exist
  # in Harness after `terraform apply` of this stack, but the Cloudflare API
  # token is NOT wired yet. If this pipeline fires before the go-live step
  # in mp-network/docs/iacm-migration-onboarding.md (Step 4 — land token in
  # SSM + add Harness workspace secret), the Plan stage will fail at
  # `terraform init` (cloudflare provider can't authenticate). That failure
  # is expected and desirable — it proves nothing applies accidentally.
  # ===========================================================================
  stages:
    # =======================================================================
    # Init / Plan + Cost Anomaly Check
    # =======================================================================
    - stage:
        name: Init Plan
        identifier: init_plan
        type: IACM
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: MarkAsFailure
        spec:
          workspace: iacm_mp_network
          # k8s_prod build pod — same rationale as karpo_infra (no Harness
          # Hosted VM on this account; staging EKS at vCPU quota). mp-network
          # manages Cloudflare resources only (no EKS, no AWS compute) so the
          # self-mutating-cluster risk Codex flagged in PR #234 doesn't apply
          # here — there's no path for a Cloudflare apply to evict its own
          # build pod.
          infrastructure:
            type: KubernetesDirect
            spec:
              connectorRef: k8s_prod
              namespace: karpo
          execution:
            steps:
              - step:
                  type: IACMTerraformPlugin
                  name: Init
                  identifier: init
                  timeout: 10m
                  spec:
                    command: init
                    resources:
                      limits:
                        memory: 1Gi
                        cpu: 500m
              - step:
                  type: IACMTerraformPlugin
                  name: Plan
                  identifier: plan
                  timeout: 30m
                  spec:
                    command: plan
                    resources:
                      limits:
                        memory: 1Gi
                        cpu: 500m
              # Cost-anomaly check — identical logic to karpo_infra trios
              # (see iacm-plan.yaml.tpl for the full commentary). Pulls the
              # workspace's persisted Infracost output and exports
              # cost_change_pct for the next stage's `when:` condition.
              # Cloudflare resources don't carry per-resource cost in
              # Infracost's catalog today (no AWS/GCP/Azure SKU mapping), so
              # in practice this step will export 0 and the approval gate
              # will auto-skip. Kept for symmetry with the karpo_infra trios
              # and so the path is exercised if Cloudflare cost coverage
              # ships later.
              - step:
                  type: Run
                  name: Cost Anomaly Check
                  identifier: cost_anomaly_check
                  timeout: 5m
                  spec:
                    shell: Sh
                    image: alpine:3.19
                    connectorRef: dockerhub_anonymous
                    envVariables:
                      HARNESS_API_BASE: https://machinepulse.harness.io
                      HARNESS_ACCOUNT: <+account.identifier>
                      HARNESS_ORG: default
                      HARNESS_PROJECT: KarpoInfra
                      HARNESS_WORKSPACE: iacm_mp_network
                      ANOMALY_THRESHOLD_PCT: "25"
                      HARNESS_SA_KEY: <+secrets.getValue("harness_sa_api_key")>
                    command: |
                      set -u

                      # Narrow `set -e` to apk only — Cursor PR #242 nit
                      # flagged that a failed `apk add` masks the real
                      # cause behind misleading "curl: not found" /
                      # "jq: not found" further down. The rest of the
                      # script is intentionally fail-OPEN (every curl /
                      # jq failure path falls through to
                      # cost_change_pct=0 so transient Harness API
                      # hiccups don't block apply); blanket `set -e`
                      # would flip that semantic.
                      if ! apk add --no-cache curl jq >/dev/null 2>&1; then
                        echo "ERROR: apk add curl jq failed — alpine registry unreachable or container in degraded state. Cannot run cost-anomaly check."
                        exit 1
                      fi

                      WS_URL="${HARNESS_API_BASE}/iacm/api/orgs/${HARNESS_ORG}/projects/${HARNESS_PROJECT}/workspaces/${HARNESS_WORKSPACE}?accountIdentifier=${HARNESS_ACCOUNT}"

                      WS_JSON=$(curl -sS --max-time 30 -H "x-api-key: ${HARNESS_SA_KEY}" "$WS_URL" || echo "")
                      if [ -z "$WS_JSON" ]; then
                        echo "WARN: workspace API call failed — fail-open with cost_change_pct=0"
                        cost_change_pct=0
                      else
                        COST_UUID=$(printf '%s' "$WS_JSON" | jq -r '.cost_breakdown_json // empty')
                        if [ -z "$COST_UUID" ]; then
                          echo "WARN: cost_breakdown_json UUID not in workspace metadata — cost_change_pct=0"
                          cost_change_pct=0
                        else
                          DATA_URL="${HARNESS_API_BASE}/iacm/api/orgs/${HARNESS_ORG}/projects/${HARNESS_PROJECT}/workspaces/${HARNESS_WORKSPACE}/data/${COST_UUID}?accountIdentifier=${HARNESS_ACCOUNT}"
                          COST_JSON=$(curl -sS --max-time 30 -H "x-api-key: ${HARNESS_SA_KEY}" "$DATA_URL" || echo "")
                          if [ -z "$COST_JSON" ]; then
                            echo "WARN: cost data API call failed — cost_change_pct=0"
                            cost_change_pct=0
                          else
                            CURR=$(printf '%s' "$COST_JSON" | jq -r '.totalMonthlyCost // 0')
                            PAST=$(printf '%s' "$COST_JSON" | jq -r '.pastTotalMonthlyCost // 0')
                            echo "current monthly cost (USD): $CURR"
                            echo "past monthly cost (USD):    $PAST"
                            cost_change_pct=$(awk -v c="$CURR" -v p="$PAST" 'BEGIN { if (p+0 == 0) print 0; else printf "%.0f", (c-p)/p*100 }')
                          fi
                        fi
                      fi

                      echo "cost_change_pct=$cost_change_pct"
                      echo "anomaly_threshold_pct=$ANOMALY_THRESHOLD_PCT"
                      export cost_change_pct
                    outputVariables:
                      - name: cost_change_pct
                        type: String
                        value: cost_change_pct
                    resources:
                      limits:
                        memory: 256Mi
                        cpu: 200m

    # =======================================================================
    # Approval Gate (skipped unless cost diff ≥ threshold %)
    # Same approver list / Argus webhook as the karpo_infra trios.
    # =======================================================================
    - stage:
        name: Approval Gate
        identifier: approval_gate
        type: Approval
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: MarkAsFailure
        when:
          pipelineStatus: Success
          condition: <+pipeline.stages.init_plan.spec.execution.steps.cost_anomaly_check.output.outputVariables.cost_change_pct> >= 25
        spec:
          execution:
            steps:
              - step:
                  name: Approve Apply
                  identifier: approve_apply
                  type: HarnessApproval
                  timeout: 72h
                  spec:
                    approvalMessage: |
                      **Workspace:** iacm_mp_network
                      **Cost change:** <+pipeline.stages.init_plan.spec.execution.steps.cost_anomaly_check.output.outputVariables.cost_change_pct>% (threshold 25%)
                      **Pipeline run:** <+pipeline.executionUrl>

                      Review the plan output and IaCM Cost Change Estimation
                      tab in the Harness UI before approving. Approval
                      triggers `terraform apply` against Cloudflare.
                    includePipelineExecutionHistory: true
                    approvers:
                      minimumCount: 1
                      disallowPipelineExecutor: true
                      userGroups:
                        - _project_all_users
                        - account.ResearchDevelopment
                      serviceAccounts:
                        - account.LarkApprover
                    isAutoRejectEnabled: false

    # =======================================================================
    # Apply
    # =======================================================================
    - stage:
        name: Apply
        identifier: apply
        type: IACM
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: MarkAsFailure
        when:
          pipelineStatus: Success
        spec:
          workspace: iacm_mp_network
          infrastructure:
            type: KubernetesDirect
            spec:
              connectorRef: k8s_prod
              namespace: karpo
          execution:
            steps:
              - step:
                  type: IACMTerraformPlugin
                  name: Init
                  identifier: init
                  timeout: 10m
                  spec:
                    command: init
                    resources:
                      limits:
                        memory: 1Gi
                        cpu: 500m
              - step:
                  type: IACMTerraformPlugin
                  name: Apply
                  identifier: apply
                  timeout: 30m
                  spec:
                    command: apply
                    resources:
                      limits:
                        memory: 1Gi
                        cpu: 500m

  # ===========================================================================
  # Notification rule — same Argus → Lark webhook as the karpo_infra pipeline.
  # See iacm-plan.yaml.tpl for the rationale on URL / secret reuse.
  # ===========================================================================
  notificationRules:
    - name: Argus IaCM Approval Webhook
      identifier: argus_iacm_approval_webhook
      pipelineEvents:
        - type: WaitingForUserAction
      notificationMethod:
        type: Webhook
        spec:
          webhookUrl: https://52-3-143-233.sslip.io/webhook/harness/prod-approval
          headers:
            Authorization: 'Bearer <+secrets.getValue("argus_harness_webhook_secret")>'
      enabled: true

